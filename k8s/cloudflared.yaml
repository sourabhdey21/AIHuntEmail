# Remotely managed Cloudflare Tunnel.
# 1. Zero Trust → Networks → Tunnels → Create Cloudflared tunnel
# 2. Copy the token (eyJ...)
# 3. oc create secret generic tunnel-token -n huntmail --from-literal=token='eyJ...'
# 4. oc apply -f k8s/cloudflared.yaml
# 5. In the tunnel, add a public hostname:
#      huntmail.coderift.fun  →  http://huntmail:8080
# 6. Point DNS CNAME huntmail.coderift.fun → <TUNNEL_ID>.cfargotunnel.com
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: huntmail
  labels:
    app: cloudflared
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cloudflared
          image: docker.io/cloudflare/cloudflared:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: tunnel-token
                  key: token
          args:
            - tunnel
            - --no-autoupdate
            - --loglevel
            - info
            - --metrics
            - 0.0.0.0:2000
            - run
          ports:
            - name: metrics
              containerPort: 2000
          livenessProbe:
            httpGet:
              path: /ready
              port: metrics
            failureThreshold: 3
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: cloudflared-metrics
  namespace: huntmail
  labels:
    app: cloudflared
spec:
  selector:
    app: cloudflared
  ports:
    - name: metrics
      port: 2000
      targetPort: metrics
