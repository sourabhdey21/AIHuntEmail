apiVersion: apps/v1
kind: Deployment
metadata:
  name: huntmail
  namespace: huntmail
  labels:
    app: huntmail
spec:
  replicas: 1
  selector:
    matchLabels:
      app: huntmail
  template:
    metadata:
      labels:
        app: huntmail
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: huntmail
          image: docker.io/sourabhdey21700/huntmail:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: HUNTMAIL_DATA
              value: /app/data
            - name: WATCH_INTERVAL_MINUTES
              value: "30"
            - name: SMTP_EMAIL
              valueFrom:
                secretKeyRef:
                  name: huntmail-smtp
                  key: SMTP_EMAIL
            - name: SMTP_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: huntmail-smtp
                  key: SMTP_APP_PASSWORD
            - name: SENDER_NAME
              valueFrom:
                secretKeyRef:
                  name: huntmail-smtp
                  key: SENDER_NAME
          volumeMounts:
            - name: data
              mountPath: /app/data
          readinessProbe:
            httpGet:
              path: /api/status
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/status
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1001
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: huntmail-data
