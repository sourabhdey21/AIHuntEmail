apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: huntmail-data
  labels:
    app: huntmail
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: huntmail
  labels:
    app: huntmail
spec:
  replicas: 1
  selector:
    matchLabels:
      app: huntmail
  template:
    metadata:
      labels:
        app: huntmail
    spec:
      containers:
        - name: huntmail
          image: docker.io/sourabhdey21/huntmail:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: HUNTMAIL_DATA
              value: /app/data
            - name: SMTP_EMAIL
              valueFrom:
                secretKeyRef:
                  name: huntmail-smtp
                  key: SMTP_EMAIL
            - name: SMTP_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: huntmail-smtp
                  key: SMTP_APP_PASSWORD
            - name: SENDER_NAME
              valueFrom:
                secretKeyRef:
                  name: huntmail-smtp
                  key: SENDER_NAME
            - name: WATCH_INTERVAL_MINUTES
              value: "30"
          volumeMounts:
            - name: data
              mountPath: /app/data
          readinessProbe:
            httpGet:
              path: /api/status
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/status
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: huntmail-data
---
apiVersion: v1
kind: Service
metadata:
  name: huntmail
  labels:
    app: huntmail
spec:
  selector:
    app: huntmail
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: huntmail
  labels:
    app: huntmail
spec:
  to:
    kind: Service
    name: huntmail
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
